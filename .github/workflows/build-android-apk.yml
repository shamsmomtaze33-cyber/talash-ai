# TALASH Ai Release APK & Google Play AAB GitHub Actions Workflow
name: Build TALASH Ai Android Release (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      talash_app_url:
        description: 'Production TALASH Ai URL wrapped by Android app'
        required: true
        default: 'https://ais-pre-raiv567ekxtle6r2ircqo4-727549841273.europe-west2.run.app'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks

      - name: Generate Gradle Wrapper & Build Debug, Release APK & Play Store AAB
        env:
          TALASH_APP_URL: ${{ github.event.inputs.talash_app_url }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug bundleRelease
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease
          fi

      - name: Upload TALASH Ai APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talash-ai-android-release
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
