plugins {
    id 'com.android.application'
}

android {
    namespace "com.shamstalash.talashai"
    compileSdk 35

    defaultConfig {
        applicationId "com.shamstalash.talashai"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // Owner-configured production host URL passed into BuildConfig / strings
        resValue "string", "talash_server_url", System.getenv("TALASH_APP_URL") ?: "https://ais-pre-raiv567ekxtle6r2ircqo4-727549841273.europe-west2.run.app"
    }

    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.activity:activity:1.9.3'
}
